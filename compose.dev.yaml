services:
  web:
    build: { target: dependencies }
    command:
      ["sh", "-c", "npm run db:generate && npm run dev -- --hostname 0.0.0.0"]
    environment: { NODE_ENV: development }
    read_only: false
    volumes:
      [".:/app", "dev_node_modules:/app/node_modules", "dev_next:/app/.next"]
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ["127.0.0.1:8025:8025"]
    networks: [backend]
volumes:
  dev_node_modules:
  dev_next:
